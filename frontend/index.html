<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutor de Equações</title>
  <script src="js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=STIX+Two+Text:ital,wght@0,500;1,500&display=swap">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/exercise.css">
  <link rel="stylesheet" href="css/chat.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo" aria-hidden="true"><span>x</span></div>
      <div class="brand">
        <h1 data-i18n="app.title">Tutor de Equações</h1>
        <p data-i18n="header.subtitle">Equações do 1º grau, uma dica de cada vez</p>
      </div>

      <div class="settings">
        <div class="language-switch" role="group" aria-label="Idioma" data-i18n-label="settings.language">
          <button type="button" data-language="pt" aria-pressed="true">PT</button>
          <button type="button" data-language="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="icon-button" id="theme-toggle" aria-pressed="false" aria-label="Tema escuro" data-i18n-label="settings.darkTheme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel exercise" id="exercise" aria-labelledby="exercise-title">
        <p class="eyebrow" id="exercise-title" data-i18n="exercise.label">Exercício</p>
        <p class="exercise-story" id="exercise-story" data-i18n="exercise.intro">Um exemplo para começar:</p>
        <p class="equation" id="exercise-equation">2<var>x</var> + 3 = 11</p>

        <div class="difficulty" role="group" aria-label="Dificuldade" data-i18n-label="exercise.difficulty">
          <button type="button" class="chip" data-difficulty="easy" aria-pressed="true" data-i18n="exercise.easy">Fácil</button>
          <button type="button" class="chip" data-difficulty="medium" aria-pressed="false" data-i18n="exercise.medium">Médio</button>
          <button type="button" class="chip" data-difficulty="hard" aria-pressed="false" data-i18n="exercise.hard">Difícil</button>
        </div>

        <button type="button" class="button-primary" id="new-exercise" data-i18n="exercise.new">Novo exercício</button>
        <p class="exercise-error" id="exercise-error" role="alert" hidden></p>
      </section>

      <section class="panel chat" aria-label="Conversa com o tutor" data-i18n-label="chat.label">
        <div class="messages" id="messages" aria-live="polite">
          <div class="message tutor" data-i18n="chat.welcome"></div>
        </div>

        <form class="composer" id="composer">
          <textarea id="composer-input" rows="1" maxlength="1000" aria-label="Sua mensagem" data-i18n-label="chat.input" data-i18n-placeholder="chat.placeholder"></textarea>
          <button type="submit" class="send" aria-label="Enviar" data-i18n-label="chat.send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
